name: Release

# Changesets flow: while pending changesets exist on main, this keeps a "Version Packages" pull
# request up to date (bumped versions, rewritten CHANGELOGs). Merging that PR publishes every
# package whose version is not yet on npm, with provenance attestations.
on:
  push:
    branches:
      - main

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC, no npm token) needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Create release pull request or publish
        uses: changesets/action@v2
        # v2 renamed every input (v1's version/publish/title/commit are ignored) and takes the
        # GitHub token only through `github-token`, which defaults to this workflow's own token.
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          pr-title: "Released pending package versions"
          commit-message: "Bumped package versions"
        env:
          # No npm token: each package trusts this workflow on npmjs.com, and npm exchanges the
          # job's OIDC token (id-token: write above) for a short-lived publish token.
          NPM_CONFIG_PROVENANCE: "true"
