name: Release

# Changesets flow: while pending changesets exist on main, this keeps a "Version Packages" pull
# request up to date (bumped versions, rewritten CHANGELOGs). Merging that PR publishes every
# package whose version is not yet on npm, with provenance attestations.
on:
  push:
    branches:
      - main

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Create release pull request or publish
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          title: "Released pending package versions"
          commit: "Bumped package versions"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Granular automation token for the @brain-bbqs org on npmjs.com, or drop this line once
          # the packages are set up for OIDC trusted publishing (see docs/VENDORING.md).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
