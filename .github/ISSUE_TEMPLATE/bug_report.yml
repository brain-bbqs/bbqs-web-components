name: Bug report
description: Report a problem with one of the @brain-bbqs packages
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@brain-bbqs/config"
        - "@brain-bbqs/utils"
        - "@brain-bbqs/ember-client"
        - "@brain-bbqs/ui"
        - "@brain-bbqs/test-utils"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is, and which app it showed up in.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
    validations:
      required: false
