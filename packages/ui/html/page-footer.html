<!-- Fixed bottom bar. Replace the repository URL and the brand marks with the app's own; same
     structure buildPageFooter() produces. -->
<div class="page-footer-bar">
  <div class="footer-left">
    <div class="footer-row">
      <a
        class="footer-text-link"
        href="https://github.com/brain-bbqs/APP/issues/new?template=bug_report.yml"
        target="_blank"
        rel="noopener"
      >
        🐛 Report a bug
      </a>
    </div>
    <div class="footer-row">
      <a
        class="footer-text-link"
        href="https://github.com/brain-bbqs/APP/issues/new?template=feature_request.yml"
        target="_blank"
        rel="noopener"
      >
        💡 Request a feature
      </a>
    </div>
    <div class="footer-row">
      <!-- Text filled in by renderVersion() from the build-time __APP_VERSION__ define. -->
      <a
        id="version-indicator"
        class="version-link"
        href="https://github.com/brain-bbqs/APP"
        target="_blank"
        rel="noopener"
        title="View source on GitHub"
      ></a>
    </div>
  </div>
  <div class="footer-brands">
    <a
      class="footer-brand-link captioned"
      href="https://talmolab.org/"
      target="_blank"
      rel="noopener"
      aria-label="Talmo Lab"
      title="Talmo Lab"
    >
      <img class="footer-brand-logo on-light" src="/src/assets/talmolab-logo.svg" alt="" />
      <img class="footer-brand-logo on-dark" src="/src/assets/talmolab-logo-on-dark.svg" alt="" />
      <span class="footer-brand-name">Talmo Lab</span>
    </a>
    <a
      class="footer-brand-link"
      href="https://centerforopenneuroscience.org"
      target="_blank"
      rel="noopener"
      aria-label="Center for Open Neuroscience"
      title="Center for Open Neuroscience"
    >
      <img class="footer-brand-logo" src="/src/assets/con-logo.png" alt="Center for Open Neuroscience" />
    </a>
  </div>
</div>
