<!-- The "What's New" footer link and the modal it opens; same structure buildWhatsNew() produces.
     The row goes first in the footer's .footer-left, above "Report a bug"; the dialog goes after
     the footer bar. initWhatsNew() fills #whats-new-content from the app's CHANGELOG.md. -->
<div class="footer-row">
  <button id="whats-new-button" class="whats-new-link" type="button">✨ What's New</button>
</div>

<dialog id="whats-new-modal" class="whats-new-modal">
  <div class="whats-new-modal-header">
    <h2>What's New</h2>
    <button id="whats-new-close" class="whats-new-close" type="button" aria-label="Close">&times;</button>
  </div>
  <div id="whats-new-content" class="whats-new-content"></div>
  <button id="whats-new-show-more" class="whats-new-show-more" type="button" hidden>Show more</button>
</dialog>
