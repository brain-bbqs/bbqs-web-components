<!-- The dashed drop target, idle. Same markup buildDropzone() produces. -->
<div id="dropzone" class="dropzone">
  <div class="dz-inner">
    <div class="dz-icon"><span>📁</span></div>
    <p>
      Drop your dataset folder here, or
      <button type="button" id="browseFolderBtn" class="dz-browse">browse for a folder</button>.
    </p>
    <p class="dz-hint">Everything inside the folder is scanned first; you choose what to include next.</p>
    <p class="dz-reject" hidden></p>
  </div>
</div>
